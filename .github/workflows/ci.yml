name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  indexing-examples:
    name: Indexing examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: examples/envio
      - run: npm audit --omit=dev
        working-directory: examples/envio
      - run: npm run check
        working-directory: examples/envio
        env:
          ENVIO_ROBINHOOD_MAINNET_RPC_URL: https://rpc.mainnet.chain.robinhood.com
          ENVIO_ROBINHOOD_TESTNET_RPC_URL: https://rpc.testnet.chain.robinhood.com
      - run: npm ci --ignore-scripts
        working-directory: examples/graph
      - run: npm audit --omit=dev
        working-directory: examples/graph
      - run: npm run check
        working-directory: examples/graph

  workflow-security:
    name: Workflow security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          version: 1.28.0
          collect: all
          online-audits: false
          min-severity: medium
          advanced-security: false
          annotations: true
