version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /examples/envio
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      envio-example:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /examples/graph
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      graph-example:
        patterns: ["*"]
