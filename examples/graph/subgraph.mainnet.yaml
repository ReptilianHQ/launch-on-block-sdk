# Generated from the SDK public indexing boundary. Configure this network alias in Graph Node.
specVersion: 1.3.0
description: Launch On Block public integration events for robinhood-chain-mainnet
repository: https://github.com/ReptilianHQ/launch-on-block-sdk
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: Launchpad
    network: robinhood-chain-mainnet
    source:
      address: '0x135492B3cCb2cb64749F91332F929F49a1DeeD3F'
      abi: Launchpad
      startBlock: 17957183
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - LaunchpadLaunchCreatedEvent
        - LaunchpadCurveAvailabilitySetEvent
        - LaunchpadCurveRegisteredEvent
        - LaunchpadCurveSelectedEvent
        - LaunchpadBuyEvent
        - LaunchpadSellEvent
        - LaunchpadGraduatedEvent
        - LaunchpadClaimedEvent
      abis:
        - name: Launchpad
          file: ../../indexing/abis/Launchpad.events.json
      eventHandlers:
        - event: LaunchCreated(indexed address,indexed address,uint16,uint16,address,string)
          handler: handleLaunchpadLaunchCreatedEvent
        - event: CurveAvailabilitySet(indexed uint32,bool)
          handler: handleLaunchpadCurveAvailabilitySetEvent
        - event: CurveRegistered(indexed uint32,indexed address,bytes32)
          handler: handleLaunchpadCurveRegisteredEvent
        - event: CurveSelected(indexed address,indexed uint32,indexed address,uint256)
          handler: handleLaunchpadCurveSelectedEvent
        - event: Buy(indexed address,indexed address,uint256,uint256)
          handler: handleLaunchpadBuyEvent
        - event: Sell(indexed address,indexed address,uint256,uint256)
          handler: handleLaunchpadSellEvent
        - event: Graduated(indexed address,indexed address,uint256,uint256,uint256,uint256,uint256,uint256)
          handler: handleLaunchpadGraduatedEvent
        - event: Claimed(indexed address,uint256)
          handler: handleLaunchpadClaimedEvent
      file: ./src/Launchpad.ts

  - kind: ethereum/contract
    name: Router
    network: robinhood-chain-mainnet
    source:
      address: '0xf3FCB520dEF7473f0eeB473a73Cade20A2EB1f4a'
      abi: Router
      startBlock: 17957183
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - RouterSwapEvent
      abis:
        - name: Router
          file: ../../indexing/abis/Router.events.json
      eventHandlers:
        - event: Swap(indexed address,indexed address,uint256,uint256,indexed address)
          handler: handleRouterSwapEvent
      file: ./src/Router.ts

  - kind: ethereum/contract
    name: FeeController
    network: robinhood-chain-mainnet
    source:
      address: '0xbD885463e6e0F24eE467f173719a7330ADE1Ca01'
      abi: FeeController
      startBlock: 17957183
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - FeeControllerFeesCollectedEvent
      abis:
        - name: FeeController
          file: ../../indexing/abis/FeeController.events.json
      eventHandlers:
        - event: FeesCollected(indexed address,indexed address,uint256,uint256,uint256,uint256,uint256,uint256)
          handler: handleFeeControllerFeesCollectedEvent
      file: ./src/FeeController.ts
templates:
  - kind: ethereum/contract
    name: LaunchToken
    network: robinhood-chain-mainnet
