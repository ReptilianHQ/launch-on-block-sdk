# Generated from the typed catalog. Fresh replay required when migrating the old per-event schema.
"""Launch identity and payout terms joined by chain/token. Preserve partial curve and graduation evidence; no balances or price inference."""
type LobLaunch {
  id: ID!
  token: String!
  creator: String
  payoutWallet: String
  creatorBps: BigInt
  curveFeeBps: BigInt
  metadataURI: String
  createdBlock: BigInt
  curveId: BigInt
  curveImpl: String
  quoteTarget: BigInt
  pool: String
  graduatedBlock: BigInt
}

"""Protocol pool membership proven by Launchpad.Graduated; token0/token1 and reserves require separate reviewed evidence."""
type LobPool {
  id: ID!
  pool: String!
  token: String!
  graduatedBlock: BigInt!
}

"""Canonical decoded events; rollback removes orphan rows with materialized entities."""
type LobProtocolEvent {
  id: ID!
  chainId: BigInt! @index
  contract: String! @index
  kind: String! @index
  signature: String!
  emitter: String! @index
  blockNumber: BigInt! @index
  blockHash: String!
  blockTimestamp: BigInt!
  transactionHash: String! @index
  transactionIndex: BigInt!
  logIndex: BigInt!
  payload: String!
}
